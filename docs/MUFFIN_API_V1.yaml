        preliminary_at: { type: string, format: date-time, nullable: true }
        preliminary_by: { type: string, format: uuid, nullable: true }
        final_at: { type: string, format: date-time, nullable: true }
        final_by: { type: string, format: uuid, nullable: true }
        values:
