        value_type: { type: string, enum: [TEXT, LONG_TEXT, SELECT, DATE, DATETIME] }
        options_schema:
          nullable: true
          oneOf:
            - { type: array, items: { type: string } }
            - { type: object }
        methodology: { type: string, nullable: true, maxLength: 250 }
        unit: { type: string, nullable: true, maxLength: 80 }
        reference_low: { type: number, nullable: true }
        reference_high: { type: number, nullable: true }
        reference_text: { type: string, nullable: true }
        is_active: { type: boolean, default: true }
    ParameterDefinitionPatch:
