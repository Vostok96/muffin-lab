      properties:
        code: { type: string, minLength: 2, maxLength: 50 }
        name: { type: string, minLength: 2, maxLength: 180 }
        section: { type: string, nullable: true, maxLength: 120 }
        value_type: { type: string, enum: [TEXT, LONG_TEXT, SELECT, DATE, DATETIME] }
        options_schema:
