        name: { type: string }
        section: { type: string, nullable: true }
        value_type: { type: string, enum: [TEXT, LONG_TEXT, SELECT, DATE, DATETIME] }
        options_schema:
          nullable: true
          oneOf:
            - { type: array, items: { type: string } }
            - { type: object }
        methodology: { type: string, nullable: true }
        unit: { type: string, nullable: true }
        reference_low: { type: number, nullable: true }
        reference_high: { type: number, nullable: true }
        reference_text: { type: string, nullable: true }
        display_order: { type: integer, minimum: 1 }
        is_required: { type: boolean }
        value_text: { type: string, nullable: true }
        value_code: { type: string, nullable: true }
        observed_at: { type: string, format: date-time, nullable: true }
    Result:
