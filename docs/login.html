<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>MUFFIN | Ingreso</title>
    <link rel="stylesheet" href="/MUFFIN/Content/css?v=ivzLv745bmnThkrYOWP2Oyh3EQaw__rxaWvN5bNa0zg1">
    <link rel="stylesheet" href="/MUFFIN/Content/muffin.css">
    <style>
        :root {
            --analizate-green: #0e6655;
            --analizate-green-bright: #1a9a78;
            --analizate-red: #b5204c;
            --muffin-cream: #fff8ec;
            --muffin-ink: #183e39;
            --muffin-muted: #607773;
        }
        body {
            background:
                radial-gradient(circle at 16% 16%, rgba(26,154,120,.20) 0 12%, transparent 13%),
                radial-gradient(circle at 86% 12%, rgba(181,32,76,.17) 0 10%, transparent 11%),
                linear-gradient(145deg, #061916 0%, #0b2924 48%, #123f38 100%);
            box-sizing: border-box;
            margin: 0;
            min-height: 100vh;
            padding: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.97);
            border: 1px solid rgba(26, 154, 120, 0.18);
            border-radius: 1.4rem;
            border-top: 5px solid var(--analizate-green-bright);
            box-sizing: border-box;
            padding: 2.75rem 2.25rem 1.85rem;
            position: relative;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 24px 64px rgba(9, 32, 40, 0.36);
        }
        .login-card .brand {
            text-align: center;
            margin-bottom: 1.65rem;
        }
        .login-card .brand img {
            width: min(100%, 290px);
            height: 128px;
            border-radius: 1rem;
            border: 2px solid rgba(26, 154, 120, 0.42);
            padding: 8px 12px;
            background: #fff;
            box-shadow: 0 10px 24px rgba(14, 102, 85, 0.12);
            margin-bottom: 0.85rem;
            object-fit: contain;
        }
        .login-card .brand h1 {
            color: var(--muffin-ink);
            font-size: 1.12rem;
            font-weight: 800;
            margin: 0;
            letter-spacing: 0;
            line-height: 1.18;
        }
        .login-card .brand p {
            color: var(--muffin-muted);
            font-size: 0.7rem;
            margin: 0.1rem 0 0;
        }
        .login-card .brand::after {
            background: linear-gradient(90deg, var(--analizate-green-bright) 0 72%, var(--analizate-red) 72% 100%);
            border-radius: 999px;
            content: "";
            display: block;
            height: 4px;
            margin: 0.85rem auto 0;
            max-width: 8rem;
        }
        .login-card form {
            margin-top: 0.2rem;
        }
        .product-footer {
            align-items: center;
            border-top: 1px solid #dceae7;
            display: grid;
            gap: 0.68rem;
            grid-template-columns: auto minmax(0, 1fr);
            margin-top: 1.05rem;
            padding-top: 0.88rem;
            text-align: left;
        }
        .product-footer img {
            background: #fff;
            border: 1px solid #d3e6e0;
            border-radius: 0.85rem;
            display: block;
            height: 42px;
            object-fit: contain;
            padding: 4px;
            width: 42px;
        }
        .product-footer strong {
            color: var(--muffin-ink);
            display: block;
            font-size: 0.78rem;
            letter-spacing: 0.02em;
            line-height: 1.2;
        }
        .product-footer span {
            color: var(--muffin-muted);
            display: block;
            font-size: 0.68rem;
            line-height: 1.25;
            margin-top: 0.08rem;
        }
        .product-footer small {
            color: #829799;
            display: block;
            font-size: 0.64rem;
            line-height: 1.25;
            margin-top: 0.18rem;
        }
        .login-card .form-group {
            display: block;
            margin-bottom: 0.95rem;
            width: 100%;
        }
        .login-card label {
            color: var(--muffin-ink);
            display: block;
            font-size: 0.8rem;
            font-weight: 700;
            margin-bottom: 0.32rem;
        }
        .login-card .form-control {
            background: #f8fbf9;
            border: 1.5px solid #d8ebe5;
            color: var(--muffin-ink);
            border-radius: 0.7rem;
            display: block;
            padding: 0.65rem 0.9rem;
            font-size: 0.95rem;
            width: 100%;
        }
        .login-card .form-control:focus {
            background: #fff;
            border-color: var(--analizate-green-bright);
            box-shadow: 0 0 0 3px rgba(26, 154, 120, 0.14);
            color: var(--muffin-ink);
        }
        .login-card .form-control::placeholder {
            color: #bccac6;
        }
        .btn-muffin {
            background: linear-gradient(100deg, var(--analizate-green), var(--analizate-green-bright));
            border: none;
            color: #fff;
            display: block;
            font-weight: 800;
            font-size: 0.95rem;
            padding: 0.65rem;
            border-radius: 0.7rem;
            letter-spacing: 0.04em;
            box-shadow: 0 6px 16px rgba(14, 102, 85, 0.24);
            transition: all 0.2s ease;
            width: 100%;
        }
        .btn-muffin:hover {
            background: linear-gradient(100deg, #084c40, var(--analizate-green-bright));
            box-shadow: 0 8px 22px rgba(14, 102, 85, 0.34);
            color: #fff;
        }
        .btn-muffin:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        /* ── dark mode overrides ── */
        [data-theme="dark"] body { background:
                radial-gradient(circle at 12% 18%, rgba(26,154,120,.16) 0 10%, transparent 11%),
                radial-gradient(circle at 88% 12%, rgba(181,32,76,.14) 0 9%, transparent 10%),
                linear-gradient(145deg, #041310 0%, #071f1b 46%, #0d332d 100%); }
        [data-theme="dark"] .login-card { background: rgba(16,32,42,.94); box-shadow: 0 24px 64px rgba(0,0,0,.56); }
        [data-theme="dark"] .login-card .brand h1 { color: #d8eee5 !important; }
        [data-theme="dark"] .login-card .brand p { color: #96b5b0 !important; }
        [data-theme="dark"] .product-footer { border-color: #25474d; }
        [data-theme="dark"] .product-footer img { background: #e8f3ef; border-color: #2e5960; }
        [data-theme="dark"] .product-footer strong { color: #d4e8e2; }
        [data-theme="dark"] .product-footer span { color: #95b5b0; }
        [data-theme="dark"] .product-footer small { color: #72918d; }
        [data-theme="dark"] .login-card label { color: #b4c8c3; }
        [data-theme="dark"] .login-card .form-control { background: #0f222b; border-color: #1e3e44; color: #d4e8e2; }
        [data-theme="dark"] .login-card .form-control::placeholder { color: #5a7a72; }
        [data-theme="dark"] .login-card .form-control:focus { background: #183b34; border-color: #5dc29d; box-shadow: 0 0 0 3px rgba(93,194,157,.16); }
        .alert {
            border-radius: 0.7rem;
            font-size: 0.8rem;
            padding: 0.55rem 0.9rem;
        }
        .spinner-border {
            width: 1.1rem;
            height: 1.1rem;
            border-width: 0.15rem;
        }
        /* ── theme toggle ── */
        .theme-pill {
            background: rgba(255,255,255,.14);
            border: 1.5px solid rgba(255,255,255,.22);
            border-radius: 999px;
            cursor: pointer;
            height: 2.2rem;
            outline: none;
            padding: 0;
            position: absolute;
            right: 1rem;
            top: 1rem;
            transition: background .25s, border .25s;
            width: 4.2rem;
            z-index: 10;
        }
        @media (max-width: 520px) {
            .login-card {
                padding: 2.35rem 1.35rem 1.55rem;
            }
            .theme-pill {
                right: 0.75rem;
                top: 0.75rem;
            }
        }
        .theme-pill:hover { background: rgba(255,255,255,.24); }
        .theme-pill .pill-track {
            align-items: center;
            display: flex;
            height: 100%;
            justify-content: space-between;
            padding: 0 .5rem;
            position: relative;
            width: 100%;
        }
        .theme-pill .pill-thumb {
            background: linear-gradient(135deg, var(--analizate-green-bright), var(--analizate-green));
            border-radius: 50%;
            box-shadow: 0 2px 6px rgba(0,0,0,.2);
            height: 1.55rem;
            left: .3rem;
            position: absolute;
            transition: transform .3s cubic-bezier(.4,0,.2,1), background .3s;
            width: 1.55rem;
        }
        [data-theme="dark"] .theme-pill .pill-thumb {
            transform: translateX(2rem);
            background: linear-gradient(135deg, #5dc29d, var(--analizate-red));
        }
        .theme-pill .pill-icon {
            font-size: .85rem;
            line-height: 1;
            transition: opacity .2s;
            user-select: none;
            z-index: 1;
        }
        .theme-pill .pill-sun { color: #f4ad83; opacity: 1; }
        .theme-pill .pill-moon { color: #b4d0e8; opacity: .5; }
        [data-theme="dark"] .theme-pill .pill-sun { opacity: .5; }
        [data-theme="dark"] .theme-pill .pill-moon { opacity: 1; }
        [data-theme="dark"] .theme-pill { background: rgba(0,0,0,.3); border-color: rgba(255,255,255,.1); }
        [data-theme="dark"] .theme-pill:hover { background: rgba(0,0,0,.45); }
    </style>
</head>
<body>
    <div class="login-card">
        <button class="theme-pill" id="theme-toggle" title="Alternar modo oscuro / claro" aria-label="Alternar modo">
            <span class="pill-track">
                <span class="pill-thumb"></span>
                <span class="pill-icon pill-sun" aria-hidden="true">&#x2600;</span>
                <span class="pill-icon pill-moon" aria-hidden="true">&#x263D;</span>
            </span>
        </button>
        <div class="brand">
            <img src="/MUFFIN_ICONO.jpg" alt="Hospital Sub Regional de Andahuaylas">
            <h1>Hospital Sub Regional de Andahuaylas</h1>
            <p>MUFFIN Microbiología Hospitalaria</p>
        </div>

        <div id="error-box" class="alert alert-danger" style="display:none;"></div>

        <form id="login-form">
            <div class="form-group mb-3">
                <label for="username">Usuario</label>
                <input type="text" id="username" class="form-control" placeholder="Nombre de usuario" autocomplete="username" required autofocus>
            </div>
            <div class="form-group mb-4">
                <label for="password">Contraseña</label>
                <input type="password" id="password" class="form-control" placeholder="Contraseña" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-muffin btn-block w-100" id="login-btn">
                <span id="btn-text">Ingresar</span>
                <span id="btn-spinner" class="spinner-border spinner-border-sm" style="display:none;" role="status"></span>
            </button>
        </form>

        <footer class="product-footer" aria-label="Información corporativa de MUFFIN">
            <img src="/MUFFIN_PRODUCTO.jpg" alt="Logo MUFFIN">
            <div>
                <strong>MUFFIN</strong>
                <span>Microbiología: Unidad de Fuentes, Flujos e Informes Nosocomiales.</span>
                <small>&copy; 2026 RyM SAC. Propiedad intelectual de RyM SAC.</small>
            </div>
        </footer>
    </div>

    <script>
        // ── Theme toggle ──
        (function(){
            var h = document.documentElement;
            var saved = localStorage.getItem('muffin-theme');
            if (saved === 'dark') h.setAttribute('data-theme', 'dark');
            else if (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches) h.setAttribute('data-theme', 'dark');
            document.getElementById('theme-toggle').addEventListener('click', function(){
                var cur = h.getAttribute('data-theme');
                var next = cur === 'dark' ? 'light' : 'dark';
                h.setAttribute('data-theme', next);
                localStorage.setItem('muffin-theme', next);
            });
        })();

        // ── Login ──
        const API = '/api/v1';

        // Clear any stale session on login page load
        localStorage.removeItem('muffin_token');

        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            const btnText = document.getElementById('btn-text');
            const btnSpinner = document.getElementById('btn-spinner');
            const errorBox = document.getElementById('error-box');
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            errorBox.style.display = 'none';
            btn.disabled = true;
            btnText.style.display = 'none';
            btnSpinner.style.display = 'inline-block';

            try {
                const response = await fetch(API + '/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.detail || 'Credenciales inválidas.');
                }

                const data = await response.json();
                localStorage.setItem('muffin_token', data.access_token);
                localStorage.setItem('muffin_token_type', data.token_type);
                localStorage.setItem('muffin_expires_in', data.expires_in.toString());

                window.location.href = '/MUFFIN/';
            } catch (error) {
                errorBox.textContent = error.message;
                errorBox.style.display = 'block';
                btn.disabled = false;
                btnText.style.display = 'inline';
                btnSpinner.style.display = 'none';
            }
        });
    </script>
</body>
</html>
