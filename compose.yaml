services:
  postgres:
    image: postgres:16
    container_name: muffin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-muffin}
      POSTGRES_USER: ${POSTGRES_USER:-muffin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    command:
      - postgres
      - -c
      - shared_buffers=384MB
      - -c
      - effective_cache_size=1024MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=40
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_compression=on
    volumes:
      - muffin_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 1536m
    cpus: 2.0

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${MUFFIN_PYTHON_BASE_IMAGE:-python:3.12-slim}
    container_name: muffin-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-muffin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-muffin}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-30}
      DEFAULT_INSTITUTION_NAME: "${DEFAULT_INSTITUTION_NAME:-MUFFIN Microbiología Hospitalaria}"
      DEFAULT_INSTITUTION_SLUG: "${DEFAULT_INSTITUTION_SLUG:-muffin-padre}"
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_GIVEN_NAME: ${BOOTSTRAP_ADMIN_GIVEN_NAME:-Administrador}
      BOOTSTRAP_ADMIN_FAMILY_NAME: ${BOOTSTRAP_ADMIN_FAMILY_NAME:-MUFFIN}
    ports:
      - "${MUFFIN_BIND_ADDRESS:-0.0.0.0}:${MUFFIN_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 4
    mem_limit: 768m
    cpus: 1.5

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        PYTHON_BASE_IMAGE: ${MUFFIN_PYTHON_BASE_IMAGE:-python:3.12-slim}
    container_name: muffin-frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      SIMCORE_CLONE_HOST: 0.0.0.0
      SIMCORE_CLONE_PORT: 8501
      MUFFIN_API_URL: http://api:8000/api/v1
      DEFAULT_INSTITUTION_NAME: "${DEFAULT_INSTITUTION_NAME:-MUFFIN Microbiología Hospitalaria}"
      DEFAULT_INSTITUTION_SLUG: "${DEFAULT_INSTITUTION_SLUG:-muffin-padre}"
      MUFFIN_INSTITUTION_NAME: "${MUFFIN_INSTITUTION_NAME:-}"
      MUFFIN_INSTITUTION_SLUG: "${MUFFIN_INSTITUTION_SLUG:-}"
      MUFFIN_CLIENT_ROOT: "${MUFFIN_CLIENT_ROOT:-}"
      MUFFIN_BRAND_IMAGE: "${MUFFIN_BRAND_IMAGE:-}"
      MUFFIN_PRODUCT_IMAGE: "${MUFFIN_PRODUCT_IMAGE:-}"
      MUFFIN_MASCOT_IMAGE: "${MUFFIN_MASCOT_IMAGE:-}"
      MUFFIN_SIGNERS_CONFIG: "${MUFFIN_SIGNERS_CONFIG:-}"
      MUFFIN_PRODUCT_NAME: "${MUFFIN_PRODUCT_NAME:-MUFFIN Microbiología Hospitalaria}"
      MUFFIN_PRODUCT_TAGLINE: "${MUFFIN_PRODUCT_TAGLINE:-Microbiología: Unidad de Fuentes, Flujos e Informes Nosocomiales}"
      MUFFIN_COPYRIGHT_OWNER: "${MUFFIN_COPYRIGHT_OWNER:-}"
      MUFFIN_IP_OWNER: "${MUFFIN_IP_OWNER:-RyM SAC}"
      MUFFIN_VERSION: "${MUFFIN_VERSION:-1.0}"
    ports:
      - "${MUFFIN_BIND_ADDRESS:-0.0.0.0}:${MUFFIN_FRONTEND_PORT:-8501}:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/MUFFIN/Login/Index')"]
      interval: 15s
      timeout: 5s
      retries: 4
    mem_limit: 256m
    cpus: 0.75

volumes:
  muffin_postgres_data:
    name: muffin_postgres_data
